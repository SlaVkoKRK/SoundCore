name: Build Windows Installer

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Building SoundCore $v"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Validate installer sources
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          if ($v -ne "${{ steps.version.outputs.version }}") { throw "VERSION mismatch" }
          $bootstrap = Get-Content installer\bootstrap.ps1 -Raw
          if (-not $bootstrap.Contains('${Label}:')) { throw 'bootstrap.ps1 is missing the fixed label interpolation.' }
          if ($bootstrap.Contains('[string[]]$Args')) { throw 'bootstrap.ps1 uses reserved automatic variable $args as a parameter.' }
          if (-not $bootstrap.Contains('[string[]]$Arguments')) { throw 'bootstrap.ps1 is missing the safe $Arguments parameter.' }
          if (-not $bootstrap.Contains("Run -Exe `$python -Arguments @('-m','venv',`$venv)")) { throw 'bootstrap.ps1 venv invocation is not using explicit -Arguments.' }
          if ($bootstrap.Contains("-Arguments @('-c'")) { throw 'bootstrap.ps1 must not use python -c for runtime verification.' }
          if (-not $bootstrap.Contains('soundcore_verify_')) { throw 'bootstrap.ps1 is missing file-based runtime verification.' }
          if (-not (Test-Path 'installer\SoundCore.iss')) { throw 'installer\SoundCore.iss not found.' }
          Write-Host "Installer sources validated for $v"

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "ISCC.exe not found" }
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.version }}" "installer\SoundCore.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify installer
        shell: pwsh
        run: |
          $file = "installer\output\SoundCore-Setup-${{ steps.version.outputs.version }}.exe"
          if (!(Test-Path $file)) { throw "Installer not created: $file" }
          Get-FileHash $file -Algorithm SHA256 | Format-List

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundCore-Setup-${{ steps.version.outputs.version }}
          path: installer/output/SoundCore-Setup-${{ steps.version.outputs.version }}.exe
          if-no-files-found: error

      - name: Attach installer to GitHub Release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" "installer\output\SoundCore-Setup-${{ steps.version.outputs.version }}.exe" --clobber
